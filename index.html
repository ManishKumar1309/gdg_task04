<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEXORA - Next-Gen Customer Relationship Management Dashboard">
  <title>Login - NEXORA</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  
  <!-- Font Awesome 6 CDN for clean UI icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="src/css/style.css">
  <script>
    document.documentElement.setAttribute('data-theme', 'light');
  </script>
</head>
<body class="login-body">

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <img src="assets/icons/nexora-icon.png" alt="NEXORA" class="logo-light">
          <img src="assets/icons/nexora-icon-dark.png" alt="NEXORA" class="logo-dark">
        </div>
        <h1 class="login-title">NEXORA</h1>
        <p class="login-subtitle" id="auth-subtitle">Login to continue</p>
      </div>

      <!-- Auth Switcher Tabs (Login / Register) -->
      <div class="auth-tabs-nav">
        <button type="button" class="auth-tab-btn active" id="tab-login-btn">Login</button>
        <button type="button" class="auth-tab-btn" id="tab-register-btn">Register</button>
      </div>

      <!-- Demo Credentials Helper Banner (Shown on Login Tab) -->
      <div class="demo-credentials-banner" id="demo-banner">
        <i class="fa-solid fa-key"></i>
        <div>
          <div><strong>Demo Account:</strong> <code>admin@nexora.com</code></div>
          <div><strong>Password:</strong> <code>admin123</code></div>
        </div>
        <button type="button" class="demo-fill-btn" id="demo-fill-btn">Auto Fill</button>
      </div>

      <!-- Alert container for error/success messages -->
      <div id="alert-container"></div>

      <!-- 1. Login Form -->
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon-left"></i>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="admin@crm.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password"
            >
            <button type="button" class="password-toggle-btn" id="toggle-password-btn" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye" id="toggle-icon"></i>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-label" for="remember-me">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link" id="forgot-password-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary btn-block" id="login-submit-btn">
          Login <i class="fa-solid fa-arrow-right"></i>
        </button>

        <div class="auth-switch-text">
          Don't have an account? <span class="auth-switch-link" id="switch-to-register">Register</span>
        </div>
      </form>

      <!-- 2. Register Form (Hidden by default) -->
      <form id="register-form" style="display: none;" novalidate>
        <div class="form-group">
          <label for="reg-name" class="form-label">Full Name</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-user input-icon-left"></i>
            <input 
              type="text" 
              id="reg-name" 
              class="form-input" 
              placeholder="e.g. Rahul Sharma" 
              required 
              autocomplete="name"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon-left"></i>
            <input 
              type="email" 
              id="reg-email" 
              class="form-input" 
              placeholder="name@company.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">Create Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon-left"></i>
            <input 
              type="password" 
              id="reg-password" 
              class="form-input" 
              placeholder="Minimum 6 characters" 
              required 
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" id="reg-toggle-password-btn" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye" id="reg-toggle-icon"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-confirm-password" class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-shield-halved input-icon-left"></i>
            <input 
              type="password" 
              id="reg-confirm-password" 
              class="form-input" 
              placeholder="Re-enter your password" 
              required 
              autocomplete="new-password"
            >
          </div>
        </div>

        <button type="submit" class="btn-primary btn-block" id="reg-submit-btn">
          Register <i class="fa-solid fa-user-plus"></i>
        </button>

        <div class="auth-switch-text">
          Already have an account? <span class="auth-switch-link" id="switch-to-login">Login</span>
        </div>
      </form>
    </div>
  </div>

  <!-- Shared App Logic & Login Script -->
  <script src="src/js/app.js"></script>
  <script src="src/js/login.js"></script>
</body>
</html>
