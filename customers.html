<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CRM Customer Directory - Manage accounts and contacts">
  <title>Customers - CRM</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
  
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Backdrop for Mobile -->
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Left Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <a href="dashboard.html" class="brand-link">
          <div class="brand-logo-icon">
            <i class="fa-solid fa-bolt"></i>
          </div>
          <span class="brand-text">CRM</span>
        </a>
        <button type="button" class="sidebar-close-btn" id="sidebar-close-btn" aria-label="Close sidebar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Main Navigation</div>
        <a href="dashboard.html" class="nav-item">
          <i class="fa-solid fa-chart-pie"></i>
          <span>Dashboard</span>
        </a>
        <a href="customers.html" class="nav-item active">
          <i class="fa-solid fa-users"></i>
          <span>Customers</span>
        </a>
        <a href="leads.html" class="nav-item">
          <i class="fa-solid fa-bullseye"></i>
          <span>Leads</span>
        </a>
        <a href="sales.html" class="nav-item">
          <i class="fa-solid fa-chart-line"></i>
          <span>Sales</span>
        </a>
        <a href="tasks.html" class="nav-item">
          <i class="fa-solid fa-list-check"></i>
          <span>Tasks</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="logout-nav-item logout-trigger" role="button" tabindex="0">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span>Sign Out</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Top Header -->
      <header class="app-header">
        <div class="header-left">
          <button type="button" class="hamburger-btn" id="hamburger-btn" aria-label="Open navigation menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-page-title">
            <h1>Customers</h1>
            <p id="customers-total-count">Manage and track your customer base</p>
          </div>
        </div>

        <div class="header-right">
          <div class="header-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search customer records...">
          </div>

          <!-- Notifications Dropdown -->
          <div class="notification-container">
            <button type="button" class="header-icon-btn" id="notification-btn" aria-label="Notifications">
              <i class="fa-regular fa-bell"></i>
              <span class="badge-dot"></span>
            </button>
            <div class="dropdown-panel" id="notification-dropdown">
              <div class="dropdown-header">
                <h4>Notifications</h4>
                <span class="badge badge-status badge-info" style="font-size: 11px;">Active</span>
              </div>
              <div class="dropdown-list">
                <div class="dropdown-item-notification">
                  <div class="icon"><i class="fa-solid fa-user-plus"></i></div>
                  <div class="content">
                    <div class="title">Rahul Sharma updated profile details</div>
                    <div class="time">1 hour ago</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- User Profile -->
          <div class="user-profile-btn">
            <div class="user-avatar">AD</div>
            <div class="user-meta">
              <div class="name">Admin</div>
              <div class="role">Administrator</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Body -->
      <main class="content-body">
        <!-- Action Toolbar -->
        <div class="page-header-actions">
          <div class="action-tools-group">
            <!-- Search Filter -->
            <div class="filter-search-input">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="search-customers-input" placeholder="Search by name, company, email...">
            </div>

            <!-- Status Filter -->
            <select id="filter-customers-status" class="custom-select" aria-label="Filter by customer status">
              <option value="All">All Statuses</option>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
              <option value="Pending">Pending</option>
            </select>
          </div>

          <button type="button" class="btn-primary" id="open-add-customer-btn">
            <i class="fa-solid fa-plus"></i> Add Customer
          </button>
        </div>

        <!-- Customers Table Card -->
        <div class="card">
          <div class="table-responsive">
            <table class="crm-table">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Company</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="customers-table-body">
                <!-- Dynamically rendered via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add / Edit Customer Modal -->
  <div class="modal-overlay" id="customer-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="customer-modal-title">Add New Customer</h3>
        <button type="button" class="modal-close-btn" id="close-customer-modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="customer-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="cust-name">Customer Name *</label>
            <input type="text" id="cust-name" class="form-input" placeholder="e.g. Rahul Sharma" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="cust-email">Email Address *</label>
              <input type="email" id="cust-email" class="form-input" placeholder="rahul@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="cust-phone">Phone Number</label>
              <input type="tel" id="cust-phone" class="form-input" placeholder="9876543210">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="cust-company">Company Name *</label>
              <input type="text" id="cust-company" class="form-input" placeholder="TechNova" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="cust-status">Status</label>
              <select id="cust-status" class="form-input custom-select">
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
                <option value="Pending">Pending</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-secondary" id="cancel-customer-modal">Cancel</button>
          <button type="submit" class="btn-primary" id="save-customer-btn">Save Customer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Shared App & Customers JS -->
  <script src="src/js/app.js"></script>
  <script src="src/js/customers.js"></script>
</body>
</html>
